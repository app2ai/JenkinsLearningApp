# Project-wide Gradle settings. This file IS committed, so it must never contain
# secrets. Machine-specific values go in local.properties (ignored by Git), and
# CI secrets are injected by Jenkins at build time (see docs/04-credentials-and-secrets.md).

# Memory for the Gradle daemon / single-use build JVM (Jenkins runs with --no-daemon).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Use AndroidX (already the AGP 9 default, kept explicit for readers).
android.useAndroidX=true

# Each module's R class contains only its own resources.
android.nonTransitiveRClass=true

kotlin.code.style=official
